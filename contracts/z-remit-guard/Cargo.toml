[package]
name = "z-remit-guard"
version = "0.1.0"
edition = "2021"
description = "Confidential remittance guard for T3N z-space tenants — public FX quoting plus PII-safe payout execution via host:interfaces/http-with-placeholders"
license = "MIT"
publish = false

[lib]
# cdylib is what makes the wasm32-wasip2 target emit a WASM *component*.
# "lib" stays so the pure logic remains unit-testable natively.
crate-type = ["cdylib", "lib"]

[dependencies]
wit-bindgen = { version = "0.49", default-features = false, features = ["macros", "realloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
